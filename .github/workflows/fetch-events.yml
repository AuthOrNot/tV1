name: Fetch 25Live Events

# Runs on a schedule, and can also be triggered manually from the Actions tab
# for testing (workflow_dispatch).
on:
  schedule:
    # GitHub's scheduler is best-effort and can lag several minutes during
    # high load, especially on the hour. 10 minutes is a safer floor than 5.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch 25Live feed
        run: |
          mkdir -p data
          curl -sSf \
            -o data/events.json \
            "https://25livepub.collegenet.com/calendars/arlington-campus-events.json"
          echo "Fetched $(wc -c < data/events.json) bytes"

      - name: Commit and push if the feed changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update events feed [skip ci]"
            git push
          fi
